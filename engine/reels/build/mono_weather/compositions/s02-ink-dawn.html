<script>
(function () {
  const v7 = {};
// v7 scene-kit — shared browser runtime inlined into every scene by build.mjs.
// Camera creep, audio-envelope proxy (--pulse CSS var), hook slam, karaoke
// captions, counters, brand tag, onset fx, flood wipe-in, grade veil.
// Everything is a pure function of the paused GSAP timeline (deterministic).
/* global v7 */
(function () {
  const clamp01 = (v) => Math.min(1, Math.max(0, v));

  // ---- audio envelope proxy: one tween drives the --pulse CSS var -------
  v7.envProxy = function (tl, p, rootId, env, dur) {
    if (!env || env.length === 0 || dur <= 0.02) return;
    const root = document.getElementById(rootId);
    if (!root) return;
    const prox = { t: 0 };
    tl.to(prox, {
      t: dur,
      duration: dur,
      ease: "none",
      onUpdate: function () {
        const f = Math.min(env.length - 1, Math.max(0, Math.round(prox.t * 30)));
        root.style.setProperty("--pulse", env[f].toFixed(3));
      },
    }, 0);
  };

  // ---- camera: keyed [t,x,y,zoom,rot] -> sequential fromTo on #camera ----
  v7.camera = function (tl, p, keys, dur) {
    if (!keys || keys.length === 0) return;
    const cam = "#" + p + "camera";
    if (keys.length === 1) {
      const k = keys[0];
      tl.set(cam, { x: -k.x, y: -k.y, scale: k.zoom, rotation: k.rot }, 0.001);
      return;
    }
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i];
      const b = keys[i + 1];
      const span = Math.max(0.05, b.t - a.t);
      tl.fromTo(cam,
        { x: -a.x, y: -a.y, scale: a.zoom, rotation: a.rot },
        { x: -b.x, y: -b.y, scale: b.zoom, rotation: b.rot, duration: span, ease: "power2.inOut" },
        Math.max(0, a.t));
    }
  };

  // ---- hook type: per-character spring slam --------------------------------
  v7.hook = function (tl, p, lines, th, dur) {
    const box = "#" + p + "hook";
    tl.set(box, { opacity: 0 }, 0.001);
    tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.05);
    let delay = 0.05;
    lines.forEach((line, li) => {
      const chars = line.split("");
      chars.forEach((ch, ci) => {
        const sel = `#${p}hk-${li}-${ci}`;
        if (ch === " ") return;
        tl.fromTo(sel,
          { opacity: 0, scale: 0.6, y: 26 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.2)" },
          delay + ci * 0.035);
      });
      delay += 0.14 + Math.min(0.5, chars.length * 0.035);
    });
    // hold, then shrink away just before scene end
    tl.to(box, { scale: 0.94, duration: 0.3, ease: "power2.in" }, Math.max(0.1, dur - 0.32));
  };

  // ---- karaoke captions: word-level color/scale sync -----------------------
  v7.captions = function (tl, p, words, th, sceneDur, sceneStart) {
    const box = "#" + p + "cap";
    tl.set(box, { opacity: 0 }, 0.001);
    tl.fromTo(box, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 0.02);
    words.forEach((w, i) => {
      const sel = `#${p}cw-${i}`;
      const ws = Math.max(0, w.start - sceneStart);
      const we = Math.min(sceneDur - 0.05, w.end - sceneStart);
      if (we <= ws) return;
      // upcoming -> active (white, pop)
      tl.fromTo(sel,
        { color: th.inkSoft, scale: 1 },
        { color: "#FFFFFF", scale: 1.1, duration: 0.09, ease: "power2.out" },
        ws);
      // active -> spoken (accent, settle)
      tl.to(sel, { color: th.accent, scale: 1, duration: 0.12, ease: "power2.out" }, we);
    });
  };

  // ---- animated counter ------------------------------------------------------
  v7.counter = function (tl, p, counter, dur) {

// Applies GSAP tweens to the canonical rig. The rig markup is byte-identical
// in every scene (only ids get a scene prefix); these joint rotations are the
// ONLY per-scene variation, so identity and proportions cannot drift.

  // Joint oscillation around `base` between base+amp and base-amp.
  // yoyo with sine.inOut approximates sin(t) closely at joint scale.
  function swing(tl, sel, base, amp, cycleSec, dur, phase) {
    if (amp === 0 || dur <= 0.02) return;
    const half = cycleSec / 2;
    const reps = Math.max(1, Math.ceil(dur / half));
    const from = base + (phase >= 0 ? amp : -amp);
    tl.fromTo(
      sel,
      { attr: { transform: `rotate(${from.toFixed(2)})` } },
      { attr: { transform: `rotate(${(2 * base - from).toFixed(2)})` }, duration: half, ease: "sine.inOut", yoyo: true, repeat: reps - 1 },
      0,
    );
  }
  // Bounded bounce (0 -> -depth -> 0) on the bob wrapper.
  function bounce(tl, sel, depth, cycleSec, dur) {
    if (depth === 0 || dur <= 0.02) return;
    const half = cycleSec / 2;
    const reps = Math.max(1, Math.ceil(dur / half));
    tl.fromTo(
      sel,
      { attr: { transform: "translate(0 0)" } },
      { attr: { transform: `translate(0 ${(-depth).toFixed(2)})` }, duration: half, ease: "sine.inOut", yoyo: true, repeat: reps - 1 },
      0,
    );
  }

    tl.set(g("to-legsSit"), { attr: { opacity: seated ? 1 : 0 } }, 0.001);

      idle:     { lean: 0,   head: 0,  fArmL: 0,   fArmR: 0,   barbell: 0 },
      walk:     { lean: 2,   head: 0,  fArmL: 0,   fArmR: 0,   barbell: 0 },
      run:      { lean: -9,  head: -3, fArmL: 42,  fArmR: 42,  barbell: 0 },
      climb:    { lean: 14,  head: -6, fArmL: 8,   fArmR: 8,   barbell: 0 },
      lift:     { lean: 0,   head: 0,  fArmL: 6,   fArmR: 6,   barbell: 1 },
      meditate: { lean: 0,   head: 2,  fArmL: 32,  fArmR: -32, barbell: 0 },
      levitate: { lean: 0,   head: -2, fArmL: 14,  fArmR: -14, barbell: 0 },
      victory:  { lean: 0,   head: -2, fArmL: 6,   fArmR: 6,   barbell: 0 },

          tl.fromTo(g("to-barbell"),

          tl.to(g("to-barbell"), { attr: { transform: "translate(0 -108)" }, duration: cyc * 0.45, ease: "sine.inOut" }, t0 + cyc * 0.55);
          tl.fromTo(g("to-bob"),
            { attr: { transform: "translate(0 0)" } },
            { attr: { transform: "translate(0 4)" }, duration: cyc * 0.55, ease: "sine.inOut" }, t0);
          tl.to(g("to-bob"), { attr: { transform: "translate(0 0)" }, duration: cyc * 0.45, ease: "sine.inOut" }, t0 + cyc * 0.55);
        }

      }
      case "meditate":
        tl.set(g("to-armL"), { attr: { transform: "rotate(38)" } }, 0.002);
        tl.set(g("to-armR"), { attr: { transform: "rotate(-38)" } }, 0.002);

      case "levitate":

          0);
        tl.fromTo(g("to-bob"),
          { attr: { transform: "translate(0 0)" } },
          { attr: { transform: "translate(0 -12)" }, duration: 0.36, ease: "sine.out" },
          0);
        tl.to(g("to-bob"), { attr: { transform: "translate(0 0)" }, duration: 0.36, ease: "bounce.in" }, 0.36);
        break;
      case "point":

        tl.set(g("to-armR"), { attr: { transform: "rotate(-46)" } }, 0.002);
        bounce(tl, g("to-bob"), 1.6, 1.4, dur);
        break;
      default:
        bounce(tl, g("to-bob"), 1.6, 1.1, dur);
    }
  };
