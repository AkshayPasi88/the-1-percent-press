<?xml version="1.0" encoding="UTF-8"?>
<!--
  TheOne — canonical character asset (Engine v7 character consistency system).

  ONE file defines the character's identity: proportions, palette, rig joints.
  Every scene in every reel inlines THIS EXACT MARKUP (build.mjs injects it);
  scenes may only animate the named joint groups below — never redraw, never
  rescale individual body parts. Identity therefore cannot drift between scenes.

  Rig (local units, feet at y=0, up = -y; total height ~242u ≈ 3.7 heads):
    #to-root      placement wrapper (scene sets translate + scale, static)
    #to-shadow    ground contact ellipse
    #to-halo      accent separation glow (opacity driven by --pulse)
    #to-bob       whole-figure vertical oscillation  (GSAP attr translate)
    #to-squash    audio micro-squash                 (CSS scaleY w/ --pulse)
    #to-lean      whole-figure lean                  (GSAP attr rotate, pivots at feet)
    #to-legsStand / #to-legsSit   standing vs crossed-seated leg sets
    #to-legL/#to-legR   hip pivots        (GSAP attr rotate)
    #to-torso     torso drawn waist(0)->shoulder(-70), pivot at hip
    #to-armL/#to-armR   shoulder pivots  (GSAP attr rotate)
    #to-forearmL/#to-forearmR  elbow pivots (GSAP attr rotate)
    #to-head      neck pivot            (GSAP attr rotate)
    #to-barbell   lift prop, hidden by default (opacity)

  Joint groups carry NO static transform — their pivot translate lives on the
  parent <g>, so a GSAP `attr:{transform:"rotate(a)"}` tween always rotates
  about the anatomical joint. The palette is fixed; only the accent rim/halo
  takes the reel accent via var(--acc).
-->
<g id="to-root">
  <ellipse id="to-shadow" cx="0" cy="7" rx="64" ry="12" fill="#000000" opacity="0.38"/>
  <ellipse id="to-halo" cx="0" cy="-116" rx="130" ry="182" fill="var(--acc)" style="opacity:calc(0.07 + var(--pulse, 0) * 0.07)"/>

  <g id="to-bob" transform="translate(0 0)">
    <g id="to-squash" style="transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(calc(1 + var(--pulse, 0) * 0.033))">
      <g id="to-lean" transform="rotate(0)">

        <!-- ================= standing legs ================= -->
        <g id="to-legsStand">
          <g transform="translate(-17 -96)">
            <g id="to-legL">
              <rect x="-11" y="-6" width="22" height="92" rx="10.5" fill="#1B1C26" stroke="#0D0E13" stroke-width="3"/>
              <rect x="4" y="-2" width="4" height="42" rx="2" fill="#E8B84B" opacity="0.85"/>
              <g transform="translate(3 82)">
                <rect x="-17" y="-13" width="43" height="16" rx="7" fill="#202128" stroke="#0D0E13" stroke-width="3"/>
                <rect x="-17" y="1" width="43" height="4.5" rx="2.2" fill="#E8B84B"/>
              </g>
            </g>
          </g>
          <g transform="translate(17 -96)">
            <g id="to-legR">
              <rect x="-11" y="-6" width="22" height="92" rx="10.5" fill="#1B1C26" stroke="#0D0E13" stroke-width="3"/>
              <rect x="-11" y="-2" width="4" height="42" rx="2" fill="#E8B84B" opacity="0.85"/>
              <g transform="translate(-3 82)">
                <rect x="-17" y="-13" width="43" height="16" rx="7" fill="#202128" stroke="#0D0E13" stroke-width="3"/>
                <rect x="-17" y="1" width="43" height="4.5" rx="2.2" fill="#E8B84B"/>
              </g>
            </g>
          </g>
        </g>

        <!-- ================= seated (crossed) legs ================= -->
        <g id="to-legsSit" opacity="0">
          <path d="M 0 -96 q -42 -12 -62 12 q 30 16 62 6 z" fill="#1B1C26" stroke="#0D0E13" stroke-width="3"/>
          <path d="M 0 -96 q 42 -12 62 12 q -30 16 -62 6 z" fill="#17181F" stroke="#0D0E13" stroke-width="3"/>
          <ellipse cx="-54" cy="-82" rx="13" ry="8" fill="#202128" stroke="#0D0E13" stroke-width="2.5"/>
          <ellipse cx="54" cy="-82" rx="13" ry="8" fill="#202128" stroke="#0D0E13" stroke-width="2.5"/>
          <ellipse cx="-54" cy="-77" rx="13" ry="3.2" fill="#E8B84B" opacity="0.85"/>
          <ellipse cx="54" cy="-77" rx="13" ry="3.2" fill="#E8B84B" opacity="0.85"/>
        </g>

        <!-- ================= torso (pivot at hip) ================= -->
        <g transform="translate(0 -96)">
          <g id="to-torso">
            <path d="M -37 10 Q -45 -50 -30 -70 L 30 -70 Q 45 -50 37 10 Q 0 20 -37 10 Z"
                  fill="#262731" stroke="#0D0E13" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M -22 -8 Q 0 0 22 -8" stroke="#17181F" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M -9 -63 q -2 15 -5 20" stroke="#E8B84B" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 9 -63 q 2 15 5 20" stroke="#E8B84B" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="0" cy="-24" r="7" fill="#E8B84B"/>
            <circle cx="0" cy="-24" r="7" fill="none" stroke="#17181F" stroke-width="2"/>
            <path id="to-rimT" d="M -37 10 Q -45 -50 -30 -70" fill="none" stroke="var(--acc)"
                  stroke-width="4" stroke-linecap="round" style="opacity:calc(0.5 + var(--pulse, 0) * 0.3)"/>

            <!-- barbell (lift) -->
            <g id="to-barbell" opacity="0" transform="translate(0 -78)">
              <rect x="-76" y="-4.5" width="152" height="9" rx="4.5" fill="#3A3D47"/>
              <circle cx="-70" cy="0" r="22" fill="#14151C" stroke="var(--acc)" stroke-width="4"/>
              <circle cx="70" cy="0" r="22" fill="#14151C" stroke="var(--acc)" stroke-width="4"/>
              <circle cx="-70" cy="0" r="9" fill="#0B0C10"/>
              <circle cx="70" cy="0" r="9" fill="#0B0C10"/>
            </g>

            <!-- arms: shoulder pivots -->
            <g transform="translate(-33 -62)">
              <g id="to-armL">
                <rect x="-10" y="-4" width="20" height="40" rx="9" fill="#262731" stroke="#0D0E13" stroke-width="3"/>
                <rect x="-10" y="-4" width="20" height="6.5" rx="3.2" fill="#E8B84B" opacity="0.9"/>
                <g transform="translate(0 34)">
                  <g id="to-forearmL">
                    <rect x="-8.5" y="-3" width="17" height="34" rx="8" fill="#17181F" stroke="#0D0E13" stroke-width="3"/>
                    <circle cx="0" cy="35" r="9" fill="#17181F" stroke="#0D0E13" stroke-width="3"/>
                  </g>
                </g>
              </g>
            </g>
            <g transform="translate(33 -62)">
              <g id="to-armR">
                <rect x="-10" y="-4" width="20" height="40" rx="9" fill="#262731" stroke="#0D0E13" stroke-width="3"/>
                <rect x="-10" y="-4" width="20" height="6.5" rx="3.2" fill="#E8B84B" opacity="0.9"/>
                <g transform="translate(0 34)">
                  <g id="to-forearmR">
                    <rect x="-8.5" y="-3" width="17" height="34" rx="8" fill="#17181F" stroke="#0D0E13" stroke-width="3"/>
                    <circle cx="0" cy="35" r="9" fill="#17181F" stroke="#0D0E13" stroke-width="3"/>
                  </g>
                </g>
              </g>
            </g>

            <!-- head: neck pivot -->
            <g transform="translate(0 -70)">
              <g id="to-head">
                <ellipse cx="0" cy="-34" rx="33" ry="33" fill="#17181F" stroke="#0D0E13" stroke-width="3.5"/>
                <ellipse cx="8" cy="-30" rx="20" ry="17" fill="#0B0C10" opacity="0.92"/>
                <path d="M -33 -38 Q 0 -76 33 -38 Z" fill="#262731" stroke="#0D0E13" stroke-width="3" stroke-linejoin="round"/>
                <path d="M -33 -38 Q 0 -76 33 -38" fill="none" stroke="#E8B84B" stroke-width="3"/>
                <rect x="6" y="-40" width="42" height="11" rx="5.5" fill="#17181F" stroke="#0D0E13" stroke-width="3"/>
                <circle cx="-2" cy="-49" r="5.5" fill="#E8B84B"/>
              </g>
            </g>
          </g>
        </g>

        <!-- leg rim light -->
        <path id="to-rimL" d="M -28 -88 L -28 -28" stroke="var(--acc)" stroke-width="3"
              stroke-linecap="round" fill="none" style="opacity:calc(0.45 + var(--pulse, 0) * 0.3)"/>
      </g>
    </g>
  </g>
</g>
