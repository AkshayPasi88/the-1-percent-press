<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The 1% Method — Exercise 01 · Cast Your Vote</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .folio { position:absolute; right:44px; bottom:36px; font-family:var(--font-body); font-weight:600; font-size:var(--fs-micro); letter-spacing:2.5px; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="slide">

  <div style="position:absolute; inset:0; display:flex; flex-direction:column; padding:92px 84px 96px;">

    <!-- Kicker chip -->
    <div>
      <span class="card-gold" style="display:inline-block; border-radius:999px; padding:10px 22px; font-family:var(--font-body); font-weight:700; font-size:var(--fs-micro); letter-spacing:3px; color:var(--accent-deep);">EXERCISE 01 - 5 MINUTES</span>
    </div>

    <h1 style="margin:32px 0 0; font-family:var(--font-heading); font-weight:700; font-size:var(--fs-h1); line-height:1.1; color:var(--primary);">Cast Your Vote</h1>

    <p style="margin:18px 0 0; font-family:var(--font-body); font-size:var(--fs-body); line-height:1.55; color:var(--ink-soft);">Complete the sentence with a person, not a goal.</p>

    <!-- Identity statement with writing line -->
    <div style="margin-top:50px; font-family:var(--font-heading); font-style:italic; font-weight:400; font-size:var(--fs-h2); line-height:1.4; color:var(--primary);">
      I am the kind of person who <span style="display:inline-block; width:560px; height:58px; border-bottom:1.5px solid var(--gold-line); vertical-align:bottom;"></span>
    </div>

    <p style="margin:52px 0 0; max-width:820px; font-family:var(--font-body); font-size:var(--fs-body); line-height:1.55; color:var(--ink-soft);">Now list three actions so small they feel almost embarrassing - evidence your future self can point to.</p>

    <!-- Three numbered writing rows -->
    <div style="margin-top:64px; display:flex; flex-direction:column; gap:62px;">

      <div style="display:flex; align-items:flex-end; gap:22px;">
        <div style="font-family:var(--font-num); font-weight:700; font-size:var(--fs-h2); line-height:1; color:var(--accent-deep); width:36px; flex:none; margin-bottom:4px;">1</div>
        <div class="tick" style="margin-bottom:10px;"></div>
        <div style="flex:1; max-width:700px; height:68px; border-bottom:1px solid var(--line);"></div>
      </div>

      <div style="display:flex; align-items:flex-end; gap:22px;">
        <div style="font-family:var(--font-num); font-weight:700; font-size:var(--fs-h2); line-height:1; color:var(--accent-deep); width:36px; flex:none; margin-bottom:4px;">2</div>
        <div class="tick" style="margin-bottom:10px;"></div>
        <div style="flex:1; max-width:700px; height:68px; border-bottom:1px solid var(--line);"></div>
      </div>

      <div style="display:flex; align-items:flex-end; gap:22px;">
        <div style="font-family:var(--font-num); font-weight:700; font-size:var(--fs-h2); line-height:1; color:var(--accent-deep); width:36px; flex:none; margin-bottom:4px;">3</div>
        <div class="tick" style="margin-bottom:10px;"></div>
        <div style="flex:1; max-width:700px; height:68px; border-bottom:1px solid var(--line);"></div>
      </div>

    </div>

    <!-- Note strip pinned toward the foot -->
    <div class="card-gold" style="margin-top:auto; display:flex; align-items:center; gap:16px; padding:24px 30px;">
      <span class="dot-gold"></span>
      <div style="font-family:var(--font-body); font-size:var(--fs-small); line-height:1.45; color:var(--ink-soft);"><span style="font-weight:700; color:var(--primary);">Keep this page.</span> In thirty days, count the votes.</div>
    </div>

  </div>

  <div class="folio">06 - THE 1% METHOD</div>

</div>
</body>
</html>
